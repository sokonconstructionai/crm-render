events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        client_max_body_size 100M;

        location / {
            proxy_pass http://197.44.46.2:8090;

            proxy_set_header Host 197.44.46.2:8090;
            proxy_set_header Origin http://197.44.46.2:8090;
            proxy_set_header Referer http://197.44.46.2:8090/;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;

            add_header Content-Security-Policy "frame-ancestors *;" always;
            add_header Access-Control-Allow-Origin * always;

            proxy_cookie_flags ~ samesite=none secure;

            proxy_redirect http://197.44.46.2:8090/ /;
        }
    }
}
